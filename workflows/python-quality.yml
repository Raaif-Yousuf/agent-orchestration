name: python-quality

# Reusable workflow: ruff check, ruff format --check, pytest.
#
# Copy this file into your own repo's .github/workflows/ (GitHub requires
# reusable workflows to live there, not in an arbitrary path such as this
# library's workflows/ directory), then call it from another workflow with
# `uses: ./.github/workflows/python-quality.yml`, or run it by hand from the
# Actions tab (workflow_dispatch).
#
# The install step works whether the repo pins dependencies in
# requirements-dev.txt, plain requirements.txt, or a pyproject.toml with a
# "dev" extra. If none of those exist it falls back to installing ruff and
# pytest bare, so the workflow still runs instead of failing on "no
# dependency file found".

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to run against."
        type: string
        default: "3.11"
      working-directory:
        description: "Directory containing the Python project."
        type: string
        default: "."
      lint-paths:
        description: "Paths ruff should check and format-check, space separated."
        type: string
        default: "."
      test-command:
        description: "Command that runs the test suite."
        type: string
        default: "python -m pytest -q"
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version to run against."
        type: string
        default: "3.11"
      working-directory:
        description: "Directory containing the Python project."
        type: string
        default: "."
      lint-paths:
        description: "Paths ruff should check and format-check, space separated."
        type: string
        default: "."
      test-command:
        description: "Command that runs the test suite."
        type: string
        default: "python -m pytest -q"

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ruff, format, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt ruff pytest
          elif [ -f pyproject.toml ] && grep -q "project.optional-dependencies" pyproject.toml; then
            pip install -e ".[dev]" || pip install ruff pytest
          else
            pip install ruff pytest
          fi

      - name: ruff check
        run: python -m ruff check ${{ inputs.lint-paths }}

      - name: ruff format --check
        run: python -m ruff format --check ${{ inputs.lint-paths }}

      - name: Run tests
        run: ${{ inputs.test-command }}
