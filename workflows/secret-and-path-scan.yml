name: secret-and-path-scan

# A generic version of this repo's own scripts/check_sanitization.py idea:
# grep the added lines of a diff for the shapes that private data actually
# takes (absolute home paths, common token formats, bare IPv4 addresses,
# email addresses), plus whatever project-specific patterns you add.
#
# This is a floor, not a substitute for a human reading the diff, the same
# way check_sanitization.py is a floor for this repo. Copy into your own
# repo's .github/workflows/ and call it from a workflow triggered by
# `pull_request`; outside that context it falls back to scanning the last
# commit so workflow_dispatch still does something.

on:
  workflow_call:
    inputs:
      extra-patterns:
        description: >
          Extra grep -E patterns to fail on, one per line (for example
          project codenames or internal hostnames). Merged with the
          built-in patterns.
        type: string
        default: ""
      working-directory:
        type: string
        default: "."
  workflow_dispatch:
    inputs:
      extra-patterns:
        description: "Extra grep -E patterns to fail on, one per line."
        type: string
        default: ""
      working-directory:
        type: string
        default: "."

permissions:
  contents: read

jobs:
  scan:
    name: scan diff for private data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the diff to scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff "$BASE_SHA" "$HEAD_SHA" > diff.patch
          else
            git show HEAD > diff.patch
          fi
          wc -l diff.patch

      - name: Scan for private data
        env:
          EXTRA_PATTERNS: ${{ inputs.extra-patterns }}
        run: |
          set -euo pipefail
          patterns=(
            '[A-Za-z]:[\\/]Users[\\/][A-Za-z0-9._-]+'
            '/(home|Users)/[a-z][a-z0-9._-]{2,}/'
            '(gh[pousr]_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16})'
            '[0-9]{1,3}(\.[0-9]{1,3}){3}'
            '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          )
          if [ -n "$EXTRA_PATTERNS" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              patterns+=("$line")
            done <<< "$EXTRA_PATTERNS"
          fi
          hit=0
          for pattern in "${patterns[@]}"; do
            if grep -nE "^\+.*${pattern}" diff.patch | grep -v '^+++'; then
              echo "pattern matched in added lines: $pattern" >&2
              hit=1
            fi
          done
          rm -f diff.patch
          if [ "$hit" -eq 1 ]; then
            exit 1
          fi
          echo "clean"
