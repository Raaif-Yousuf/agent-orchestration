name: Feature request
description: Propose new functionality or a change to existing behavior.
title: "[feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        State the problem before the proposal. A proposal with no stated
        problem is hard to evaluate against alternatives, including the
        alternative of not building it.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What is missing, slow, or awkward right now, and who runs into it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      description: The proposed behavior, as concretely as you can state it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem, including doing nothing, and why they are worse.
    validations:
      required: false

  - type: textarea
    id: done_when
    attributes:
      label: What would tell you this is done
      description: The observable that would exist once this ships.
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority, from your perspective
      options:
        - "Nice to have"
        - "Would meaningfully help"
        - "Blocking something"
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
